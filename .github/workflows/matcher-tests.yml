name: matcher-tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install matcher dependencies
        run: pip install rapidfuzz
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
