name: chequeo-boletines-inpi
on:
  schedule:
    - cron: "0 12 * * 4"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  chequear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          pip install requests pymupdf imagehash pillow
      - name: Correr cron (con log a archivo)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          mkdir -p debug
          python cron_check_boletines.py > debug/last_run.txt 2>&1 || echo "EXIT_CODE=$?" >> debug/last_run.txt
          echo "--- curl directo a Supabase ---" >> debug/last_run.txt
          curl -s -o /tmp/curlbody.json -w "HTTP_STATUS:%{http_code}\n" \
            -X POST "$SUPABASE_URL/rest/v1/debug_logs" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d '[{"mensaje":"curl directo de prueba"}]' >> debug/last_run.txt
          cat /tmp/curlbody.json >> debug/last_run.txt
        continue-on-error: true
      - name: Commitear log de debug
        run: |
          git config user.email "bot@bot.com"
          git config user.name "cron-bot"
          git add debug/last_run.txt
          git commit -m "debug log $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "nada para commitear"
          git push
